services:

  redis:
    build: ./Auth-Service/redis
    env_file:
      - ./Auth-Service/.env.compose
    volumes:
      - web-redis-data:/data
    restart: unless-stopped

  keycloak:
    build: ./Auth-Service/keycloak
    command: ["start", "--http-enabled=true", "--proxy-headers=xforwarded", "--hostname-strict=true"]
    env_file:
      - ./Auth-Service/.env.compose
    ports:
      - "${KEYCLOAK_BIND_ADDRESS:-127.0.0.1}:${KEYCLOAK_PORT:-8080}:8080"
    restart: unless-stopped

  nats-server:
    build: ./Gateway-Service/nats
    ports:
      - 4222:4222
    restart: always

  gateway-service:
    build:
      context: ./Gateway-Service
      dockerfile: dockerfile.prod
    env_file:
      - ./Gateway-Service/.env.compose
      - ${PLATFORM_ENV_FILE:-.env.production}
    ports:
      - ${CLIENT_GATEWAY_PORT}:3000
    restart: always

  beneficiary-service:
    build:
      context: ./Beneficiary-Service
      dockerfile: dockerfile.prod
    env_file:
      - ./Beneficiary-Service/.env.compose
      - ${PLATFORM_ENV_FILE:-.env.production}
    restart: always

  global-service:
    build:
      context: ./Global-Service
      dockerfile: dockerfile.prod
    env_file:
      - ./Global-Service/.env.compose
      - ${PLATFORM_ENV_FILE:-.env.production}
    restart: always

  auth-service:
    build:
      context: ./Auth-Service
      dockerfile: dockerfile.prod
    env_file:
      - ./Auth-Service/.env.compose
      - ${PLATFORM_ENV_FILE:-.env.production}
    depends_on:
      - nats-server
      - redis
      - keycloak
    restart: always

  kiosk-service:
    build:
      context: ./Kiosk-Service
      dockerfile: dockerfile.prod
    env_file:
      - ./Kiosk-Service/.env.compose
      - ${PLATFORM_ENV_FILE:-.env.production}
    restart: always

  app-mobile-service:
    build:
      context: ./App-Mobile-Service
      dockerfile: dockerfile.prod
    env_file:
      - ./App-Mobile-Service/.env.compose
      - ${PLATFORM_ENV_FILE:-.env.production}
    restart: always
  
  records-service:
    build:
      context: ./Records-Service
      dockerfile: dockerfile.prod
    env_file:
      - ./Records-Service/.env.compose
      - ${PLATFORM_ENV_FILE:-.env.production}
    restart: always

  loans-service:
    build:
      context: ./Loans-Service
      dockerfile: dockerfile.prod
    env_file:
      - ./Loans-Service/.env.compose
      - ${PLATFORM_ENV_FILE:-.env.production}
    restart: always
    
  contributions-service:
    build:
      context: ./Contributions-Service
      dockerfile: dockerfile.prod
    env_file:
      - ./Contributions-Service/.env.compose
      - ${PLATFORM_ENV_FILE:-.env.production}
    restart: always

  sales-service:
    build:
      context: ./Sales-Service
      dockerfile: dockerfile.prod
    env_file:
      - ./Sales-Service/.env.compose
      - ${PLATFORM_ENV_FILE:-.env.production}
    restart: always
  
  collections-service:
    build:
      context: ./Collections-Service
      dockerfile: dockerfile.prod
    env_file:
      - ./Collections-Service/.env.compose
      - ${PLATFORM_ENV_FILE:-.env.production}
    restart: always

volumes:
  web-redis-data:
