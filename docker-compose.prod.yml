services:

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${WEB_REDIS_PASSWORD:?Set WEB_REDIS_PASSWORD in the parent .env}
      REDISCLI_AUTH: ${WEB_REDIS_PASSWORD:?Set WEB_REDIS_PASSWORD in the parent .env}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - web-redis-data:/data
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.1
    command: ["start"]
    environment:
      KC_FEATURES: token-exchange:v1,admin-fine-grained-authz:v1
      KC_DB: ${KC_DB:-postgres}
      KC_DB_URL_HOST: ${KC_DB_URL_HOST:?Set KC_DB_URL_HOST in the parent .env}
      KC_DB_URL_PORT: ${KC_DB_URL_PORT:-5432}
      KC_DB_URL_DATABASE: ${KC_DB_URL_DATABASE:?Set KC_DB_URL_DATABASE in the parent .env}
      KC_DB_SCHEMA: ${KC_DB_SCHEMA:-keycloak}
      KC_DB_USERNAME: ${KC_DB_USERNAME:?Set KC_DB_USERNAME in the parent .env}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?Set KC_DB_PASSWORD in the parent .env}
      KC_HEALTH_ENABLED: ${KC_HEALTH_ENABLED:-true}
      KC_HTTP_ENABLED: ${KC_HTTP_ENABLED:-true}
      KC_PROXY_HEADERS: ${KC_PROXY_HEADERS:-xforwarded}
      KC_HOSTNAME: ${KC_HOSTNAME:?Set KC_HOSTNAME to the public HTTPS Keycloak URL}
      KC_HOSTNAME_STRICT: ${KC_HOSTNAME_STRICT:-true}
      KC_BOOTSTRAP_ADMIN_USER: ${KC_BOOTSTRAP_ADMIN_USER:?Set KC_BOOTSTRAP_ADMIN_USER in the parent .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Set KC_BOOTSTRAP_ADMIN_PASSWORD in the parent .env}
    volumes:
      - ./Keycloak/themes:/opt/keycloak/themes:ro
    ports:
      - "${KEYCLOAK_BIND_ADDRESS:-127.0.0.1}:${KEYCLOAK_PORT:-8080}:8080"
    restart: unless-stopped

  nats-server:
    build: ./Gateway-Service/nats
    ports:
      - 4222:4222
    restart: always

  gateway-service:
    build:
      context: ./Gateway-Service
      dockerfile: dockerfile.prod
    env_file:
      - ./Gateway-Service/.env.compose
      - ${PLATFORM_ENV_FILE:-.env.production}
    ports:
      - ${CLIENT_GATEWAY_PORT}:3000
    restart: always

  beneficiary-service:
    build:
      context: ./Beneficiary-Service
      dockerfile: dockerfile.prod
    env_file:
      - ./Beneficiary-Service/.env.compose
      - ${PLATFORM_ENV_FILE:-.env.production}
    restart: always

  global-service:
    build:
      context: ./Global-Service
      dockerfile: dockerfile.prod
    env_file:
      - ./Global-Service/.env.compose
      - ${PLATFORM_ENV_FILE:-.env.production}
    restart: always

  auth-service:
    build:
      context: ./Auth-Service
      dockerfile: dockerfile.prod
    env_file:
      - ./Auth-Service/.env.compose
      - ${PLATFORM_ENV_FILE:-.env.production}
    depends_on:
      - nats-server
      - redis
      - keycloak
    restart: always

  kiosk-service:
    build:
      context: ./Kiosk-Service
      dockerfile: dockerfile.prod
    env_file:
      - ./Kiosk-Service/.env.compose
      - ${PLATFORM_ENV_FILE:-.env.production}
    restart: always

  app-mobile-service:
    build:
      context: ./App-Mobile-Service
      dockerfile: dockerfile.prod
    env_file:
      - ./App-Mobile-Service/.env.compose
      - ${PLATFORM_ENV_FILE:-.env.production}
    restart: always
  
  records-service:
    build:
      context: ./Records-Service
      dockerfile: dockerfile.prod
    env_file:
      - ./Records-Service/.env.compose
      - ${PLATFORM_ENV_FILE:-.env.production}
    restart: always

  loans-service:
    build:
      context: ./Loans-Service
      dockerfile: dockerfile.prod
    env_file:
      - ./Loans-Service/.env.compose
      - ${PLATFORM_ENV_FILE:-.env.production}
    restart: always
    
  contributions-service:
    build:
      context: ./Contributions-Service
      dockerfile: dockerfile.prod
    env_file:
      - ./Contributions-Service/.env.compose
      - ${PLATFORM_ENV_FILE:-.env.production}
    restart: always

  sales-service:
    build:
      context: ./Sales-Service
      dockerfile: dockerfile.prod
    env_file:
      - ./Sales-Service/.env.compose
      - ${PLATFORM_ENV_FILE:-.env.production}
    restart: always
  
  collections-service:
    build:
      context: ./Collections-Service
      dockerfile: dockerfile.prod
    env_file:
      - ./Collections-Service/.env.compose
      - ${PLATFORM_ENV_FILE:-.env.production}
    restart: always

volumes:
  web-redis-data:
